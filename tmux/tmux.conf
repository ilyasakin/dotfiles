# ~/.config/tmux/tmux.conf — the only tmux config (~/.tmux.conf is gone; tmux loads both if both exist)

# --- terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
# True color, undercurl and extended keys for the terminals in use
set -as terminal-features ',alacritty*:RGB:usstyle:extkeys'
set -as terminal-features ',xterm-kitty:RGB:usstyle:extkeys'
set -as terminal-features ',xterm-ghostty:RGB:usstyle:extkeys'
set -as terminal-features ',xterm-256color:RGB'

# Extended keys (C-, C-. …) for apps that ask for them — neovim does. 'always' would also force them on
# apps that don't understand them: Esc then can't close fzf popups (sesh, tmux-fzf).
set -s extended-keys on
set -s extended-keys-format csi-u
set -g allow-passthrough on
set -g focus-events on                    # lets neovim's FocusGained autoread fire
set -s escape-time 10                     # short enough for vim, long enough for split escape sequences
set -g set-clipboard on                   # OSC 52 to the system clipboard

# --- behaviour --------------------------------------------------------------
set -g prefix C-a
bind C-a send-prefix                      # C-a C-a sends a literal C-a (start of line in the shell)
bind a last-window                        # C-a a jumps to the previous window
set -g base-index 1                       # start indexing windows at 1 instead of 0
set -g detach-on-destroy off              # don't exit from tmux when closing a session
set -g history-limit 1000000              # increase history size (from 2,000)
set -g mouse on                           # enable mouse support
set -g renumber-windows on                # renumber all windows when any window is closed
set -g display-time 4000                  # messages stay 4s
setw -g aggressive-resize on
setw -g mode-keys vi
bind C-p previous-window
bind C-n next-window
bind R source-file ~/.config/tmux/tmux.conf \; display 'Reloaded tmux.conf'

# Copy mode: y / Enter / mouse drag copy to the macOS clipboard (was tmux-yank)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'

# --- panes ------------------------------------------------------------------
# resize panes with vim-like keys
bind -r H resize-pane -L 20
bind -r J resize-pane -D 20
bind -r K resize-pane -U 20
bind -r L resize-pane -R 20

# navigate panes with vim-like keys
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# C-h/j/k/l move between tmux panes and neovim splits (neovim side: christoomey/vim-tmux-navigator).
# Checking pane_current_command is a format lookup, so no process is spawned per keypress.
is_vim='#{m/ri:^(n?vim?x?|view|fzf)$,#{pane_current_command}}'
bind -n C-h if -F "$is_vim" 'send C-h' 'select-pane -L'
bind -n C-j if -F "$is_vim" 'send C-j' 'select-pane -D'
bind -n C-k if -F "$is_vim" 'send C-k' 'select-pane -U'
bind -n C-l if -F "$is_vim" 'send C-l' 'select-pane -R'
bind -n 'C-\' if -F "$is_vim" 'send C-\\' 'select-pane -l'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send C-l                         # prefix C-l clears the shell screen

# --- sessions (sesh) --------------------------------------------------------
bind T run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# --- status bar -------------------------------------------------------------
set -g status-position top                # macOS / darwin style
set -g status-justify left
set -g status-interval 5
source-file ~/.config/tmux/onedark.conf

# --- plugins ----------------------------------------------------------------
set -g @tmux-last-color on
set -g @tmux-last-pager 'less'
set -g @tmux-last-prompt-pattern ' '
set -g @tmux-nerd-font-window-name-shell-icon ''
set -g @tmux-nerd-font-window-name-show-name false

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fcsonline/tmux-thumbs'                     # <prefix>Space
set -g @plugin 'sainnhe/tmux-fzf'                          # <prefix>F
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'mskelton/tmux-last'                        # <prefix>t

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
# -b: plugins load in the background so the first session opens immediately
run -b '~/.config/tmux/plugins/tpm/tpm'
