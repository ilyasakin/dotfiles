# One Dark status bar, generated from odedlaz/tmux-onedark-theme so no plugin runs at startup

set -g display-panes-active-colour "#e5c07b"
set -g display-panes-colour "#61afef"
set -g status-bg "#282c34"
set -g status-fg "#aab2bf"
set -g status-left "#[fg=#282c34,bg=#98c379,bold] #S#[fg=#98c379,bg=#282c34,nobold,nounderscore,noitalics]"
set -g status-left-length 100
set -g status-right "#[fg=#aab2bf,bg=#282c34,nounderscore,noitalics]%R  %d/%m/%Y #[fg=#3e4452,bg=#282c34]#[fg=#3e4452,bg=#3e4452]#[fg=#aab2bf, bg=#3e4452] #[fg=#98c379,bg=#3e4452,nobold,nounderscore,noitalics]#[fg=#282c34,bg=#98c379,bold] #h #[fg=#e5c07b, bg=#98c379]#[fg=#e06c75,bg=#e5c07b]"
set -g status-right-length 100
setw -g window-active-style "fg=#aab2bf"
setw -g window-style "fg=#5c6370"
setw -g window-status-current-format "#[fg=#282c34,bg=#3e4452,nobold,nounderscore,noitalics]#[fg=#aab2bf,bg=#3e4452,nobold] #I  #W #[fg=#3e4452,bg=#282c34,nobold,nounderscore,noitalics]"
setw -g window-status-format "#[fg=#282c34,bg=#282c34,nobold,nounderscore,noitalics]#[fg=#aab2bf,bg=#282c34] #I  #W #[fg=#282c34,bg=#282c34,nobold,nounderscore,noitalics]"
setw -g window-status-separator ''
